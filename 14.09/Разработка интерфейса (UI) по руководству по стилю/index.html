<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM: Список партнеров и скидок</title>
    <link rel="icon" href="resources/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="application">
      <header class="application__header">
        <img class="application__logo" src="resources/company-logo.svg" alt="Логотип CRM" />
        <h1>Список партнеров и скидок</h1>
      </header>

      <section class="partners" aria-label="Список партнеров">
        <article class="partner-card">
          <span class="partner-icon partner-icon--blue" aria-hidden="true">ТД</span>
          <div class="partner-card__content">
            <h2>Партнер | ООО "Тмыв денег"</h2>
            <p>Директор</p>
            <p>+7 223 322 22 32</p>
            <p>Рейтинг: 10</p>
          </div>
          <span class="partner-card__discount">10%</span>
        </article>

        <article class="partner-card">
          <span class="partner-icon partner-icon--green" aria-hidden="true">ЗП</span>
          <div class="partner-card__content">
            <h2>Партнер | ООО "Зарплата пришла"</h2>
            <p>Директор</p>
            <p>+7 223 322 22 32</p>
            <p>Рейтинг: 10</p>
          </div>
          <span class="partner-card__discount">10%</span>
        </article>

        <article class="partner-card">
          <span class="partner-icon partner-icon--purple" aria-hidden="true">П</span>
          <div class="partner-card__content">
            <h2>Партнер | ИП Павлюченко</h2>
            <p>Директор</p>
            <p>+7 223 322 22 32</p>
            <p>Рейтинг: 10</p>
          </div>
          <span class="partner-card__discount">10%</span>
        </article>
      </section>
    </main>
  </body>
</html>
