<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM: Реестр партнеров</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="application">
      <section class="window" id="main-window" aria-labelledby="main-window-title">
        <header class="window__header">
          <div>
            <p class="window__caption">MainWindow</p>
            <h1 id="main-window-title">Реестр партнеров</h1>
          </div>
          <button class="button button--primary" id="add-partner-button" type="button">Добавить партнера</button>
        </header>

        <div class="partner-list" aria-label="Список партнеров">
          <article class="partner-card">
            <span class="partner-card__badge partner-card__badge--blue">ТД</span>
            <div>
              <h2>Партнер | ООО "Тмыв денег"</h2>
              <p>Директор · +7 223 322 22 32</p>
            </div>
            <strong>10%</strong>
          </article>
          <article class="partner-card">
            <span class="partner-card__badge partner-card__badge--green">ЗП</span>
            <div>
              <h2>Партнер | ООО "Зарплата пришла"</h2>
              <p>Директор · +7 223 322 22 32</p>
            </div>
            <strong>5%</strong>
          </article>
        </div>
      </section>

      <section class="window" id="partner-edit-window" aria-labelledby="partner-edit-window-title" hidden>
        <header class="window__header">
          <div>
            <p class="window__caption">PartnerEditWindow</p>
            <h1 id="partner-edit-window-title">Карточка партнера</h1>
          </div>
          <button class="button" id="back-button" type="button">Назад</button>
        </header>

        <form class="partner-form" id="partner-form">
          <label>
            Наименование партнера
            <input name="name" type="text" placeholder="Например, ООО «Новый партнер»" />
          </label>
          <label>
            Контактный телефон
            <input name="phone" type="tel" placeholder="+7 900 000 00 00" />
          </label>
          <label>
            Должность контакта
            <input name="position" type="text" placeholder="Менеджер" />
          </label>
          <p class="form-note">Поля сохраняются на форме при возврате к реестру: окно не перезагружается.</p>
        </form>
      </section>
    </main>
    <script src="navigation.js"></script>
    <script src="app.js"></script>
  </body>
</html>
