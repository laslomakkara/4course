<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM: Карточка партнера</title>
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="application">
      <header class="window-header"><img class="logo" src="company-logo.svg" alt="Логотип CRM" /><div><p class="caption">PartnerEditWindow</p><h1 id="page-title">Новый партнер</h1></div><button id="back-button" class="button">Назад</button></header>
      <form id="partner-form" class="partner-form" novalidate>
        <label>Наименование<input name="partnerName" placeholder="Например, Альфа" required /></label>
        <label>Тип партнера<select id="partner-type" name="partnerType" required></select></label>
        <label>Рейтинг<input name="rating" type="number" min="0" step="1" placeholder="Целое число от 0" required /></label>
        <label>Адрес<input name="address" placeholder="Город, улица, дом" required /></label>
        <label>Директор<input name="director" placeholder="Фамилия Имя Отчество" required /></label>
        <label>Телефон<input name="phone" type="tel" placeholder="+7 900 000-00-00" required /></label>
        <label>Email<input name="email" type="email" placeholder="company@example.com" required /></label>
        <button class="button button--primary" type="submit">Сохранить</button>
      </form>
      <p id="message" class="message" aria-live="polite"></p>
    </main>
    <script src="edit.js"></script>
  </body>
</html>
