<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM: Реестр партнеров</title>
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="application">
      <section id="main-window">
        <header class="application__header">
          <img class="application__logo" src="company-logo.svg" alt="Логотип CRM" />
          <div><p class="caption">MainWindow</p><h1>Реестр партнеров</h1></div>
          <div class="header-actions">
            <button class="button" id="history-button" type="button" disabled>История продаж</button>
            <button class="button button--primary" id="add-button" type="button">Добавить партнера</button>
          </div>
        </header>
        <p class="hint">Выберите партнера: карточку можно редактировать, а историю продаж открыть отдельной кнопкой.</p>
        <div class="partner-list" id="partner-list"></div>
      </section>

      <section id="partner-edit-window" hidden>
        <header class="application__header"><div><p class="caption">PartnerEditWindow</p><h1 id="form-title">Новый партнер</h1></div><button class="button" id="cancel-button" type="button">Отмена</button></header>
        <form class="partner-form" id="partner-form" novalidate>
          <label>Наименование<input name="name" /></label>
          <label>Тип партнера<select name="partnerType" id="partner-type"></select></label>
          <label>Рейтинг<input name="rating" inputmode="numeric" placeholder="Например, 5" /></label>
          <label>Адрес<input name="address" /></label>
          <label>ФИО директора<input name="director" /></label>
          <label>Телефон<input name="phone" type="tel" placeholder="+7 900 000-00-00" /></label>
          <label>Email компании<input name="email" type="email" placeholder="company@example.com" /></label>
          <div class="form-actions"><button class="button button--primary" type="submit">Сохранить</button></div>
        </form>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
